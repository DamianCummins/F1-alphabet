kind = "web"
previewPath = "/"
title = "F1 Alphabet"
version = "1.0.0"
id = "artifacts/f1-alphabet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23112

[services.development]
run = "pnpm --filter @workspace/f1-alphabet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/f1-alphabet", "run", "build" ]
publicDir = "artifacts/f1-alphabet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23112"
BASE_PATH = "/"
